# Entorno local completo. Uso:  cp .env.example .env && docker compose up --build
name: cloudcost
x-api-env: &api-env
  ENV: ${ENV:-development}
  DATABASE_URL: postgresql://cloudcost_app:${APP_DB_PASSWORD:-change-me-app}@postgres:5432/cloudcost
  REDIS_URL: redis://redis:6379/0
  AUTH_MODE: ${AUTH_MODE:-dev}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789-abcdef}
  DEMO_ENABLED: ${DEMO_ENABLED:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${WEB_PORT:-5985}}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:${WEB_PORT:-5985}}
  AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
  AUTH_SIGNUP_OPEN: ${AUTH_SIGNUP_OPEN:-true}
  AUTH_PEPPER: ${AUTH_PEPPER:-dev-only-pepper-change-me-0123456789abcdef}
  AUTH_TRUST_FORWARDED: ${AUTH_TRUST_FORWARDED:-true}      # la API solo la alcanza el BFF; ver docs/security.md
  AUTH_HIBP_ENABLED: ${AUTH_HIBP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-CloudCost <no-reply@localhost>}
  SSO_ENABLED: ${SSO_ENABLED:-false}                  # OIDC con Entra ID / Okta; ver docs/sso.md
  SSO_PROVIDER: ${SSO_PROVIDER:-entra}
  SSO_LABEL: ${SSO_LABEL:-}
  SSO_ISSUER: ${SSO_ISSUER:-}
  SSO_TENANT_ID: ${SSO_TENANT_ID:-}
  SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
  SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
  SSO_ORG_ID: ${SSO_ORG_ID:-}
  SSO_ALLOWED_DOMAINS: ${SSO_ALLOWED_DOMAINS:-}
  SSO_ROLE_CLAIM: ${SSO_ROLE_CLAIM:-}
  SSO_ROLE_MAP: ${SSO_ROLE_MAP:-}
  SSO_DEFAULT_ROLE: ${SSO_DEFAULT_ROLE:-VIEWER}
  SSO_JIT: ${SSO_JIT:-true}
  SSO_LINK_EXISTING: ${SSO_LINK_EXISTING:-false}
  SSO_REQUIRED_AMR: ${SSO_REQUIRED_AMR:-}
  PASSKEYS_ENABLED: ${PASSKEYS_ENABLED:-true}          # llaves de acceso (WebAuthn); ver docs/passkeys.md
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}                 # vacío = host de PUBLIC_WEB_URL (no lo cambies después: invalida las llaves)
  WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
  GITLAB_API_URL: ${GITLAB_API_URL:-https://gitlab.com/api/v4}
  GITLAB_TOKEN: ${GITLAB_TOKEN:-}
  GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
  LLM_ENABLED: ${LLM_ENABLED:-false}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-admin}
      POSTGRES_DB: cloudcost
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudcost"]
      interval: 5s
      retries: 20
    # Postgres no se publica al host (en Windows 5432 suele estar ocupado/reservado). Para acceder:
    #   docker compose exec postgres psql -U postgres cloudcost

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/migrate.Dockerfile }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change-me-admin}@postgres:5432/cloudcost
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-me-app}
      SEED_DEV: ${SEED_DEV:-true}
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:${API_PORT:-5986}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      retries: 10

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["celery", "-A", "cloudcost.workers.celery_app", "worker", "-l", "INFO", "--concurrency", "2"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: apps/web }
    environment:
      API_URL: http://api:8000
      DEV_LOGIN: ${AUTH_MODE:-dev}
      INSECURE_COOKIES: "1"      # solo para http://localhost; quítalo detrás de HTTPS
    depends_on: [api]
    ports: ["127.0.0.1:${WEB_PORT:-5985}:3000"]

volumes:
  pgdata:
