# Opcional:  docker compose -f docker-compose.yml -f docker-compose.observability.yml up
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["127.0.0.1:3001:3000"]
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin-change-me}" }
