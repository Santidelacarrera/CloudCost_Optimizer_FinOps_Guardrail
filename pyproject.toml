[project]
name = "cloudcost-optimizer"
version = "0.1.0"
description = "FinOps defensivo: detecta desperdicio en AWS y propone cambios IaC vía Pull Request con aprobación humana"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "psycopg[binary,pool]>=3.1.18,<4",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "PyJWT[crypto]>=2.8,<3",
  "requests>=2.31,<3",
  "celery[redis]>=5.3,<6",
  "boto3>=1.34,<2",
  "jsonschema>=4.21,<5",
  "prometheus-client>=0.20,<1",
  "python-hcl2>=4.3,<8",
]
[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24", "opentelemetry-instrumentation-fastapi>=0.45b0"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[tool.ruff]
line-length = 140
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "E501", "B008", "S608", "S603", "S607"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
