name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: admin, POSTGRES_DB: cloudcost }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:admin@localhost:5432/cloudcost
      APP_DB_PASSWORD: ci-app-pw
      DATABASE_URL: postgresql://cloudcost_app:ci-app-pw@localhost:5432/cloudcost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements-dev.txt
      - run: ruff check apps tests
      - run: SEED_DEV=true sh scripts/migrate.sh
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rf --tb=short 2>&1 | tee pytest.log
      - name: Resumen de fallos como anotación (los registros no siempre son descargables)
        if: failure()
        shell: bash
        run: |
          summary=$(grep -E "^(FAILED|ERROR)|^E  |^tests/.*Error" pytest.log | head -30 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=pytest::${summary}"

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    # Recorrido completo en un navegador real: registro, correo, login, 2FA, recuperación de contraseña y cabeceras de seguridad.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: admin, POSTGRES_DB: cloudcost }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:admin@localhost:5432/cloudcost
      APP_DB_PASSWORD: ci-app-pw
      E2E_BASE_URL: http://localhost:3000
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements.txt
      - run: sh scripts/migrate.sh
      - name: Arrancar la API (cuentas propias, correo hacia Mailpit)
        run: |
          PYTHONPATH=apps/api nohup uvicorn cloudcost.main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/api.log" 2>&1 &
        env:
          ENV: development
          DATABASE_URL: postgresql://cloudcost_app:ci-app-pw@localhost:5432/cloudcost
          AUTH_MODE: local
          DEMO_ENABLED: "false"
          AUTH_PEPPER: ci-only-pepper-0123456789-abcdefghijklmnop
          PUBLIC_WEB_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_STARTTLS: "false"
          SMTP_FROM: CloudCost <no-reply@example.com>
      - name: Construir y arrancar la web
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true
          cd .next/standalone
          API_URL=http://127.0.0.1:8000 INSECURE_COOKIES=1 PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > "$GITHUB_WORKSPACE/web.log" 2>&1 &
      - name: Esperar a los servicios
        run: |
          for url in http://127.0.0.1:8000/ready http://127.0.0.1:3000/login http://127.0.0.1:8025/api/v1/info; do
            for i in $(seq 1 60); do curl -fsS "$url" > /dev/null && break; sleep 1; done
            curl -fsS "$url" > /dev/null
          done
      - name: Instalar Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Ejecutar las pruebas
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee "$GITHUB_WORKSPACE/e2e.log"
      - name: Resumen de fallos como anotación
        if: failure()
        shell: bash
        run: |
          summary=$( { tail -n 60 api.log | grep -E "ERROR|Traceback|Error" | tail -n 8; grep -E "✘|Error:|Expected|Received|Timeout|waiting for|locator" e2e.log | head -n 25; } | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=e2e::${summary}"
      - name: Guardar informes y registros si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostico
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
            web.log
            e2e.log
          if-no-files-found: ignore

  backups:
    # Copia, restauración en una base temporal y comprobación de la cadena de auditoría, contra un Postgres real.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: admin, POSTGRES_DB: cloudcost }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:admin@localhost:5432/cloudcost
      APP_DB_PASSWORD: ci-app-pw
      BACKUP_DIR: /tmp/cloudcost-backups
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: SEED_DEV=true sh scripts/migrate.sh
      - run: sh scripts/backup.sh
      - run: sh scripts/verify_backup.sh

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with: { version: latest }
      - run: opa test packages/policies -v
      - uses: hashicorp/setup-terraform@v3
      - run: |
          for d in infrastructure/terraform/aws-readonly-role infrastructure/terraform/azure-readonly-role infrastructure/terraform/gcp-readonly-role infrastructure/terraform/example-iac; do
            (cd $d && terraform init -backend=false -input=false && terraform validate)
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: infrastructure/terraform/aws-readonly-role, soft_fail: true }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t cloudcost-api .
      - run: docker build -t cloudcost-web apps/web
      - run: docker build -f infrastructure/docker/migrate.Dockerfile -t cloudcost-migrate .
      - run: docker build -f infrastructure/docker/backup.Dockerfile -t cloudcost-backup .
      - name: El compose de producción es válido con la plantilla de variables
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml --profile monitoring config -q
      - name: Los scripts de copias son sintaxis válida
        run: for f in scripts/*.sh; do sh -n "$f"; done
