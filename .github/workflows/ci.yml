name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: admin, POSTGRES_DB: cloudcost }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgresql://postgres:admin@localhost:5432/cloudcost
      APP_DB_PASSWORD: ci-app-pw
      DATABASE_URL: postgresql://cloudcost_app:ci-app-pw@localhost:5432/cloudcost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements-dev.txt
      - run: ruff check apps tests
      - run: SEED_DEV=true sh scripts/migrate.sh
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with: { version: latest }
      - run: opa test packages/policies -v
      - uses: hashicorp/setup-terraform@v3
      - run: |
          for d in infrastructure/terraform/aws-readonly-role infrastructure/terraform/example-iac; do
            (cd $d && terraform init -backend=false -input=false && terraform validate)
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: infrastructure/terraform/aws-readonly-role, soft_fail: true }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t cloudcost-api .
      - run: docker build -t cloudcost-web apps/web
