name: release
# Publica las imágenes en GitHub Container Registry cuando se crea una etiqueta de versión (v1.2.3) o a mano desde la pestaña Actions.
# Flujo: CI verde en main → git tag v1.0.0 && git push --tags → esta publicación → workflow "deploy" con la versión 1.0.0.
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read }

jobs:
  images:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api,     file: apps/api/Dockerfile,                    context: . }
          - { name: web,     file: apps/web/Dockerfile,                    context: apps/web }
          - { name: migrate, file: infrastructure/docker/migrate.Dockerfile, context: . }
          - { name: backup,  file: infrastructure/docker/backup.Dockerfile,  context: . }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudcost-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Primero se construye y se escanea; solo si no hay vulnerabilidades graves con corrección disponible se publica.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          tags: scan-candidate:${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-candidate:${{ matrix.name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          provenance: true
          sbom: true
